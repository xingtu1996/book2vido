[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "book2vido"
version = "0.1.0"
description = "文本→视频 零成本流水线：把书 / 文章 / 长文变成能看完的短视频"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pypdf",
    "pyyaml",
    "Pillow",
    "edge-tts",
]

# `pip install .` 之后得到的 `book2vido` 命令。
# 实现在 cli.py（转发到 __main__.py:main），与 `python -m book2vido` 走同一条代码路径。
[project.scripts]
book2vido = "book2vido.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

# ⚠️ 不能用 `packages = ["book2vido"]` 写死：那样 `book2vido.gui` 子包**不会被装进去**
# （实测：装完 `python -c "import book2vido.gui"` → ModuleNotFoundError），而 GUI 是本项目的
# 主用形态之一。改成 find 后，以后新增子包也不用再回来改这里。
[tool.setuptools.packages.find]
where = ["src"]
include = ["book2vido*"]

[tool.pytest.ini_options]
# 本项目的守护脚本沿用了 `verify_*.py` 命名（见 tests/README.md），
# 不在 pytest 默认的 `test_*.py` 收集规则里 —— 不配这一行，`pytest tests/` 会
# 「0 条用例、退出码 5」，看着像通过其实一条没跑（CI 里最危险的那种绿）。
python_files = ["test_*.py", "verify_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["dist", "doc", ".backups", "packaging"]

[tool.ruff.lint]
# 显式锁定规则集，不跟着 ruff 版本漂移：
# ruff 0.16 起默认规则集比旧版大得多（实测本机对 src+tests 报 125 条，
# 其中 BLE001/S110 等一大半是本项目**刻意**的兜底写法）。这里只留
# 「真错误」级别（pyflakes F + pycodestyle 的 E4/E7/E9），保证 CI 的红=真问题。
select = ["E4", "E7", "E9", "F"]
# E501（行长）：注释多为整段中文说明，强行折行会破坏「注释跟着代码读」。
# E402（模块级 import 不在顶部）：tests/ 与入口模块要先 sys.path 注入再 import，刻意的。
ignore = ["E501", "E402"]
