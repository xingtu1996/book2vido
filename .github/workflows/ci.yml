name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上再推一次就取消上一次还在跑的任务（省 runner 分钟，也避免旧结果盖新结果）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # 不设 fail-fast：3.10 挂了也要看到 3.12 的结果 ——
      # 「只有一个版本挂」和「全挂」是两个完全不同的故障，前者多半是版本相关语法/依赖问题。
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 装载 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装（可编辑安装 + dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 静态检查（ruff）
        # 规则集在 pyproject.toml 里显式锁定（不跟 ruff 版本漂移）。
        # 接进 CI 的直接原因：GUI 的 `_install_lock` / `GUI_DIR` 未定义（F821）
        # 在没人跑静态检查的情况下躺了很久 —— 这类 "跑起来才炸" 的错必须让机器拦。
        run: ruff check src tests

      - name: 测试
        run: pytest tests/ -q

      - name: 安装产物自检（console entry + 子包）
        # 守的是两个已经踩过的坑：
        #   ① 没有 [project.scripts] → 装完没有 `book2vido` 命令
        #   ② packages 写死成 ["book2vido"] → book2vido.gui 子包根本没被装进去
        run: |
          book2vido --help
          python -c "import book2vido, book2vido.gui, book2vido.cli; print('import ok')"

      - name: 一键安装脚本自检
        # --no-venv：CI 里已经在 setup-python 准备好的解释器里装，不必再套一层。
        # 缺 ffmpeg / ollama 只警告不失败，所以这一步在 Linux runner 上也必须绿。
        run: bash scripts/install.sh --no-venv
