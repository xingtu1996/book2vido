name: Release (dmg)

# 打 tag 就出 dmg：`git tag v0.1.0 && git push origin v0.1.0`
# 只上传 artifact，**不建 GitHub Release**（要不要发版由人决定，不由 tag 决定）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  dmg:
    name: 构建 Book2Vido.dmg（macOS）
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: 装载 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装构建期依赖
        # build_app.sh 需要把依赖装进随包运行时；ffmpeg 由 brew 提供（合成环节必需）。
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          brew install ffmpeg librsvg create-dmg

      - name: 构建 .app
        # --check 先跑一遍自检：缺哪项依赖会**当场**说清楚，
        # 而不是等 10 分钟后拿到一个打不开的 .app。
        run: |
          bash packaging/build_app.sh --check
          bash packaging/build_app.sh

      - name: 打包 .dmg
        run: bash packaging/build_dmg.sh

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Book2Vido-dmg-${{ github.ref_name }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
